# Exempelkonfiguration för en egen server i EU. Inte provkörd här: kör `nginx -t` och granska
# innan den används. Poängen är att konfigurationen håller det sidan lovar.

server {
    listen 443 ssl http2;
    server_name kansliteknik.se www.kansliteknik.se;
    root /var/www/kansliteknik;                       # innehållet i dist/
    index index.html;

    # Inga åtkomstloggar: då sparas inga IP-adresser. Felloggen kan innehålla en IP-adress
    # vid tekniska fel. Rotera den dagligen och spara högst så många dagar som står på
    # sidan integritet.html (se logrotate-exemplet i README).
    access_log off;
    error_log  /var/log/nginx/kansliteknik-error.log warn;

    # Allt är statiska filer. Ingen skriptkörning, inga formulär, inga externa resurser.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Bara GET och HEAD. Sidan kan inte ta emot något.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Nedladdningar: tvinga hämtning av programmet. PDF-exemplen får öppnas i läsaren.
    # (add_header i en location ersätter serverns rubriker, så de upprepas här.)
    location /nedladdning/ {
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}

server {
    listen 80;
    server_name kansliteknik.se www.kansliteknik.se;
    access_log off;
    return 301 https://$host$request_uri;
}
